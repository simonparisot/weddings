name: Deploy eleonoreetmartial.fr to S3

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/eleonoreetmartial.fr/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/eleonoreetmartial.fr/ s3://eleonoreetmartial.fr/ --delete
          aws s3 cp frontend/eleonoreetmartial.fr/index.html s3://eleonoreetmartial.fr/index.html --cache-control "no-cache"
          aws s3 cp frontend/eleonoreetmartial.fr/style.css s3://eleonoreetmartial.fr/style.css --cache-control "no-cache"
          aws s3 cp frontend/eleonoreetmartial.fr/style-mobile.css s3://eleonoreetmartial.fr/style-mobile.css --cache-control "no-cache"
          aws s3 cp frontend/eleonoreetmartial.fr/savethedate.js s3://eleonoreetmartial.fr/savethedate.js --cache-control "no-cache"
          aws s3 cp frontend/eleonoreetmartial.fr/payment.js s3://eleonoreetmartial.fr/payment.js --cache-control "no-cache"
          aws s3 cp frontend/eleonoreetmartial.fr/liste.html s3://eleonoreetmartial.fr/liste.html --cache-control "no-cache" 